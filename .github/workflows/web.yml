name: WordPath web checks
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Vercel root Next.js version
        run: node -e "const r=require('./package.json');const w=require('./apps/web/package.json');if(!r.dependencies?.next||r.dependencies.next!==w.dependencies.next)throw Error('Next.js must be declared at Vercel root and match apps/web');"
      - name: Install workspaces
        run: npm install --no-audit --no-fund
      - name: Check shared game engine
        run: npm test
      - name: Typecheck web
        run: npm run typecheck -w @wordpath/web
      - name: Build Next.js web app from root
        run: npm run build
